name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build (CMake)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sheet: [Aufgabenblatt03, Aufgabenblatt04, Aufgabenblatt09]
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenGL and X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev
      - name: Configure CMake
        run: cmake -S ${{ matrix.sheet }}/code -B ${{ matrix.sheet }}/code/build
      - name: Build
        run: cmake --build ${{ matrix.sheet }}/code/build
